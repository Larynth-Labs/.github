name: Problem
description: Something is wrong, missing or unclear
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Page or file
      description: URL or path where you saw it
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Remove API keys, webhook secrets and phone numbers before pasting.
    validations:
      required: true
